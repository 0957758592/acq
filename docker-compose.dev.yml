# Local development infrastructure for @acq end-to-end runs.
# Usage: docker compose -f docker-compose.dev.yml up -d
# Mongo: reuse an existing local mongo on 27017 with a dedicated `acq` database
# (mongodb://127.0.0.1:27017/acq). Add a mongo service here only if none exists.
services:
  redis:
    image: redis:7-alpine
    container_name: acq-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: acq-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 20
