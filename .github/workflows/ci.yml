name: ci
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build_test_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn lint            # lint + JSDoc typecheck (SAST-lite via eslint)
      - run: yarn test            # unit + contract (jest projects)
      - run: yarn build

  security_scan:
    # TZ §18.2 — dependency scanning + SAST. Fails only on high/critical so
    # moderate transitive advisories don't block, but are still surfaced.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Dependency scan (production deps; fail on high/critical only)
        # Scope the gate to PRODUCTION dependencies (`--groups dependencies`) —
        # what actually ships — not dev-only test tooling (jest/eslint). yarn v1
        # `yarn audit` exit code is a severity bitmask (1 info, 2 low, 4 moderate,
        # 8 high, 16 critical). Surface everything, fail only on high(8)/critical(16).
        # (Dev-only transitive advisories, e.g. brace-expansion via jest — already
        # patched at 1.1.16 but mis-normalized by yarn-classic — are surfaced by the
        # separate full audit below, never block the build.)
        run: |
          yarn audit --groups dependencies || code=$?
          code=${code:-0}
          echo "yarn audit (production) severity bitmask: $code"
          # Full audit (dev + prod) for visibility only — never fails the job.
          yarn audit || true
          if [ $(( code & 8 )) -ne 0 ] || [ $(( code & 16 )) -ne 0 ]; then
            echo "High/critical vulnerabilities in production dependencies"; exit 1
          fi
          echo "No high/critical vulnerabilities in production dependencies"

  integration:
    # Live integration tests against real Mongo/Redis/RabbitMQ service containers.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      rabbitmq:
        image: rabbitmq:3-alpine
        ports: ['5672:5672']
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/acq_ci
      REDIS_URL: redis://127.0.0.1:6379
      RABBITMQ_URL: amqp://127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @acq/engine-app run test:live
      - run: yarn workspace @acq/control-plane-app run test:live
      - run: yarn workspace @acq/scrape-worker-app run test:live
