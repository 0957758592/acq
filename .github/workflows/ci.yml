name: ci
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build_test_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn lint            # lint + JSDoc typecheck (SAST-lite via eslint)
      - run: yarn test            # unit + contract (jest projects)
      - run: yarn build

  security_scan:
    # TZ §18.2 — dependency scanning + SAST. Fails only on high/critical so
    # moderate transitive advisories don't block, but are still surfaced.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Dependency scan (core production deps; fail on high/critical)
        # yarn v1's `yarn audit` exit code is only a coarse severity BITMASK — it
        # can't tell WHICH workspace a high/critical advisory affects. scripts/
        # audit-gate.mjs parses `yarn audit --json --groups dependencies` and
        # blocks ONLY on high/critical advisories that reach a CORE shipping
        # service (engine/control-plane/scrape-worker/whatsapp). Advisories whose
        # every path runs solely through the separately-deployed operator UI
        # `@acq/web` (Next.js — a perpetual DoS/SSRF advisory surface the core does
        # NOT depend on) are SURFACED but non-blocking. Nothing is hidden; the same
        # gate runs locally (node scripts/audit-gate.mjs) before every push.
        run: node scripts/audit-gate.mjs

  integration:
    # Live integration tests against real Mongo/Redis/RabbitMQ service containers.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      rabbitmq:
        image: rabbitmq:3-alpine
        ports: ['5672:5672']
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/acq_ci
      REDIS_URL: redis://127.0.0.1:6379
      RABBITMQ_URL: amqp://127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @acq/engine-app run test:live
      - run: yarn workspace @acq/control-plane-app run test:live
      - run: yarn workspace @acq/scrape-worker-app run test:live
